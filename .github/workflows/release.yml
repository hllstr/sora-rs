name: Release Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog from commits
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGES.md

  build-and-release:
    name: Build (${{ matrix.build_type }} / ${{ matrix.target }})
    needs: changelog
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [stable, performance, profiling]
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
          targets: ${{ matrix.target }}

      - name: Install cross
        run: make install-cross

      - name: Build Release
        run: make BUILD_TYPE=${{ matrix.build_type }} TARGET=${{ matrix.target }}

      - name: Upload Binary to Release
        uses: softprops/action-gh-release@v2
        with:
          files: sora-on-rust-${{ matrix.build_type }}-${{ matrix.target }}
          body: ${{ needs.changelog.outputs.changelog }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
